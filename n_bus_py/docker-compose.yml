services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nbus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/nbus
      # ── LLM provider keys ──────────────────────────────────
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-${LLM_API_KEY:-}}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-${LLM_BASE_URL:-https://api.deepseek.com/v1}}
      MERCURY_API_KEY: ${MERCURY_API_KEY:-${LLM_API_KEY:-}}
      MERCURY_BASE_URL: ${MERCURY_BASE_URL:-https://api.inceptionlabs.ai/v1}
      # ── Backward compat fallbacks ──────────────────────────
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      # ── Auth ───────────────────────────────────────────────
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-true}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
